# Customer MCP Server - OpenShift Deployment
# Deploys the Customer MCP server with a Service and Route.
# Prerequisites: Customer API must be deployed (acme-customer-service on port 8081).
#
# Usage:
#   oc apply -f 02-mcp-servers/openshift/customer-mcp.yaml
#   oc get route mcp-customer-route -o jsonpath='https://{.spec.host}/mcp'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-mcp
  labels:
    app: customer-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-mcp
  template:
    metadata:
      labels:
        app: customer-mcp
    spec:
      containers:
      - name: mcp-server
        image: quay.io/acme/mcp-server-customer:1.0.0
        imagePullPolicy: Always
        env:
        - name: CUSTOMER_API_BASE_URL
          value: "http://acme-customer-service:8081"
        ports:
        - containerPort: 9001
          name: http
          protocol: TCP
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-customer-service
  labels:
    app: customer-mcp
spec:
  type: ClusterIP
  selector:
    app: customer-mcp
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-customer-route
  labels:
    app: customer-mcp
spec:
  to:
    kind: Service
    name: mcp-customer-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

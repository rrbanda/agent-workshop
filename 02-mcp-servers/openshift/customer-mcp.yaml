# Customer MCP Server - OpenShift Deployment
# Deploys the Customer MCP server with a Service and Route.
# Prerequisites:
#   1. Customer API must be deployed (acme-customer-service on port 8081)
#   2. Image must be built first. Use the admin deploy script:
#        00-setup/admin/deploy.sh <namespace>
#      Or build manually:
#        oc new-build --binary --strategy=docker --name=customer-mcp
#        oc start-build customer-mcp --from-dir=02-mcp-servers/customer-mcp/ --follow
#
# Usage:
#   oc apply -f 02-mcp-servers/openshift/customer-mcp.yaml
#   oc get route mcp-customer-route -o jsonpath='https://{.spec.host}/mcp'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-mcp
  labels:
    app: customer-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-mcp
  template:
    metadata:
      labels:
        app: customer-mcp
    spec:
      containers:
      - name: mcp-server
        image: image-registry.openshift-image-registry.svc:5000/acme-workshop/customer-mcp:latest
        imagePullPolicy: Always
        env:
        - name: CUSTOMER_API_BASE_URL
          value: "http://acme-customer-service:8081"
        - name: PORT_FOR_CUSTOMER_MCP
          value: "9001"
        - name: HOST_FOR_CUSTOMER_MCP
          value: "0.0.0.0"
        ports:
        - containerPort: 9001
          name: http
          protocol: TCP
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-customer-service
  labels:
    app: customer-mcp
spec:
  type: ClusterIP
  selector:
    app: customer-mcp
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-customer-route
  labels:
    app: customer-mcp
spec:
  to:
    kind: Service
    name: mcp-customer-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

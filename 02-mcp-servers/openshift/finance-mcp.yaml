# Finance MCP Server - OpenShift Deployment
# Deploys the Finance MCP server with a Service and Route.
# Prerequisites:
#   1. Finance API must be deployed (acme-finance-service on port 8082)
#   2. Image must be built first. Use the admin deploy script:
#        00-setup/admin/deploy.sh <namespace>
#      Or build manually:
#        oc new-build --binary --strategy=docker --name=finance-mcp
#        oc start-build finance-mcp --from-dir=02-mcp-servers/finance-mcp/ --follow
#
# Usage (replace NAMESPACE with your OpenShift project name):
#   sed "s/NAMESPACE/$(oc project -q)/g" 02-mcp-servers/openshift/finance-mcp.yaml | oc apply -f -
#   oc get route mcp-finance-route -o jsonpath='https://{.spec.host}/mcp'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-mcp
  labels:
    app: finance-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-mcp
  template:
    metadata:
      labels:
        app: finance-mcp
    spec:
      containers:
      - name: mcp-server
        image: image-registry.openshift-image-registry.svc:5000/NAMESPACE/finance-mcp:latest
        imagePullPolicy: Always
        env:
        - name: FINANCE_API_BASE_URL
          value: "http://acme-finance-service:8082"
        - name: PORT_FOR_FINANCE_MCP
          value: "9002"
        - name: HOST_FOR_FINANCE_MCP
          value: "0.0.0.0"
        ports:
        - containerPort: 9002
          name: http
          protocol: TCP
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-finance-service
  labels:
    app: finance-mcp
spec:
  type: ClusterIP
  selector:
    app: finance-mcp
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-finance-route
  labels:
    app: finance-mcp
spec:
  to:
    kind: Service
    name: mcp-finance-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

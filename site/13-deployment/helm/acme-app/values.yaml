postgresql:
  customer:
    enabled: true
    name: postgresql-customer
    replicas: 1
    image:
      repository: registry.redhat.io/rhel9/postgresql-15
      pullPolicy: IfNotPresent
    service:
      name: postgres-cust
      port: 5432
    env:
      user: acme
      password: acme
      adminPassword: postgres
      database: acme_customer
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
  finance:
    enabled: true
    name: postgresql-finance
    replicas: 1
    image:
      repository: registry.redhat.io/rhel9/postgresql-15
      pullPolicy: IfNotPresent
    service:
      name: postgres-fin
      port: 5432
    env:
      user: acme
      password: acme
      adminPassword: postgres
      database: acme_finance
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
  mortgage:
    enabled: true
    name: postgresql-mortgage
    replicas: 1
    image:
      repository: registry.redhat.io/rhel9/postgresql-15
      pullPolicy: IfNotPresent
    service:
      name: postgres-mort
      port: 5432
    env:
      user: acme
      password: acme
      adminPassword: postgres
      database: acme_mortgage
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

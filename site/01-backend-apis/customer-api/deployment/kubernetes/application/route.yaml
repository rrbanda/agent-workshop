apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: acme-customer-service
  labels:
    app: acme-customer-api
spec:
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: acme-customer-service
    weight: 100
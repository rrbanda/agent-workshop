# ACME Backend APIs: Customer, Finance, Mortgage
# Images are built via oc new-build and stored in the internal registry.
# The NAMESPACE placeholder is replaced at deploy time by deploy.sh.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
  labels:
    app: customer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-api
  template:
    metadata:
      labels:
        app: customer-api
    spec:
      containers:
      - name: customer-api
        image: image-registry.openshift-image-registry.svc:5000/NAMESPACE/customer-api:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-cust:5432/acme_customer"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        - name: SERVER_PORT
          value: "8081"
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 512Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: acme-customer-service
  labels:
    app: customer-api
spec:
  selector:
    app: customer-api
  ports:
  - port: 8081
    targetPort: 8081
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: acme-customer-service
  labels:
    app: customer-api
spec:
  to:
    kind: Service
    name: acme-customer-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

runtime:
  cache_dir: ./.cache/antora

site:
  title: "NovaCrest Agent Workshop"
  url: https://rrbanda.github.io/agent-workshop/
  start_page: novacrest-agent-workshop::index.adoc

content:
  sources:
    - url: .
      branches: [main]
      start_path: documentation

asciidoc:
  attributes:
    release-version: v1.0
    page-pagination: true
    page-hide-versions-component: true
    experimental: true
    github-repo: https://github.com/rrbanda/agent-workshop
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js

ui:
  bundle:
    url: https://github.com/redhat-scholars/course-ui/releases/download/v0.1.14/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./gh-pages

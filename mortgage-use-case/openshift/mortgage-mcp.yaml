# Mortgage MCP Server - OpenShift Deployment
# Deploys the Mortgage MCP server with a Service and Route.
# Prerequisites:
#   1. Mortgage API must be deployed (acme-mortgage-service on port 8083)
#   2. Image must be built first. Use the admin deploy script:
#        00-setup/admin/deploy.sh <namespace>
#      Or build manually:
#        oc new-build --binary --strategy=docker --name=mortgage-mcp
#        oc start-build mortgage-mcp --from-dir=mortgage-use-case/mortgage-mcp/ --follow
#
# Usage (replace NAMESPACE with your OpenShift project name):
#   sed "s/NAMESPACE/$(oc project -q)/g" mortgage-use-case/openshift/mortgage-mcp.yaml | oc apply -f -
#   oc get route mcp-mortgage-route -o jsonpath='https://{.spec.host}/mcp'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-mcp
  labels:
    app: mortgage-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mortgage-mcp
  template:
    metadata:
      labels:
        app: mortgage-mcp
    spec:
      containers:
      - name: mcp-server
        image: image-registry.openshift-image-registry.svc:5000/NAMESPACE/mortgage-mcp:latest
        imagePullPolicy: Always
        env:
        - name: MORTGAGE_API_BASE_URL
          value: "http://acme-mortgage-service:8083"
        - name: PORT_FOR_MORTGAGE_MCP
          value: "9003"
        - name: HOST_FOR_MORTGAGE_MCP
          value: "0.0.0.0"
        ports:
        - containerPort: 9003
          name: http
          protocol: TCP
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-mortgage-service
  labels:
    app: mortgage-mcp
spec:
  type: ClusterIP
  selector:
    app: mortgage-mcp
  ports:
  - port: 9003
    targetPort: 9003
    protocol: TCP
    name: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mcp-mortgage-route
  labels:
    app: mortgage-mcp
spec:
  to:
    kind: Service
    name: mcp-mortgage-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

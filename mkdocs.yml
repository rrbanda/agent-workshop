site_name: NovaCrest Agent Workshop
site_description: Build production-ready AI agents that run anywhere -- using Llama Stack, MCP, and open-source LLMs
site_url: https://rrbanda.github.io/agent-workshop/
repo_url: https://github.com/rrbanda/agent-workshop
repo_name: rrbanda/agent-workshop

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Environment Setup: 00-setup/README.md
    - Backend APIs:
      - Overview: 01-backend-apis/README.md
      - Customer API: 01-backend-apis/customer-api/README.md
      - Finance API: 01-backend-apis/finance-api/README.md
    - MCP Servers:
      - Overview: 02-mcp-servers/README.md
      - Customer MCP: 02-mcp-servers/customer-mcp/README.md
      - Finance MCP: 02-mcp-servers/finance-mcp/README.md
  - Core Modules:
    - Llama Stack Basics: 03-llama-stack-basics/README.md
    - Agents with MCP Tools: 04-agents-with-tools/README.md
    - Multi-Turn & HITL: 05-multi-turn-and-hitl/README.md
    - RAG: 08-rag/README.md
    - Safety Shields: 09-safety-shields/README.md
    - Evaluations: 10-evaluations/README.md
  - Capstone:
    - Mortgage Approval Agent: mortgage-use-case/README.md
  - Reference: reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - callouts

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rrbanda/agent-workshop
